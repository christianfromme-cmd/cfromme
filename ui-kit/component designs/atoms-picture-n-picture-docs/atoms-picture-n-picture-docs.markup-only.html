

<h2>N-Picture</h2>

<p>Simple image component for displaying single images.</p>

<p><strong>Possible placement:</strong></p>
<ul>
    <li>Content area</li>
    <li>In galleries</li>
    <li>Inside other components</li>
</ul>

<p><strong>Options:</strong></p>
<ul>
    <li>Alt text</li>
    <li>Image source</li>
</ul>
