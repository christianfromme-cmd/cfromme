         data-module="video"
         data-module-config=""
         data-name=""
         class="videoplayer-container ">
        <figure>
            <div class="videoplayer-content">
                <video                        poster=""
                       role="application"
                       data-url="../../videos/sample-video.mp4"
                       data-item-id=""
                       data-item-name=""

                       controls
                       style="position: relative;">
                        <source src="../../videos/sample-video.mp4"
                                type="video/mp4"
                                media="(max-width:1279px)"
                                label="SD"
                                res="720" />
                </video>
            </div>
        </figure>
    </div>
</div>
