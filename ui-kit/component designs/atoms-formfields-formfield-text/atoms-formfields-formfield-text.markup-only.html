    <div data-tpl="form">
        
        <div class="field-group">
            <label for="formfield-text"
                   class="">Label *</label>
            <div class="field-group__container field-group__container--has-outer">
                <label class="form-control__container">
                    <input id="formfield-text"
                           name="formfield-text"
                           class="form-control__field"
                           type="text"
                           autocorrect="off"
                           spellcheck="false"
                           value=""
                           maxlength="255"
                           placeholder=""
                           data-sc-tracking=""
                           data-sc-field-name=""
                           data-sc-field-key=""
                           data-val-required=""
                           data-val="">
                    <div class="form-control__btns"></div>
                </label>
                
                <div class="field-group__btns field-group__btns--outer">
                </div>
            </div>
                <span class="field-validation-valid error-block"
                      data-valmsg-for="formfield-text"
                      data-valmsg-replace="true"></span>
        </div>    </div>
